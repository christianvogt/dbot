version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    target-branch: "main"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      patternfly:
        applies-to: version-updates
        update-types:
          - "patch"
        patterns:
          - "@patternfly/*"
      patch-updates:
        applies-to: version-updates
        update-types:
          - "patch"
        exclude-patterns:
          - "@patternfly/*"
